<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Hollowmere</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#241d18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --ink:#17130f; --panel:#241d18; --panel2:#2e2620; --edge:#463a2e;
    --parch:#ddd0b4; --dim:#95866f; --gold:#c9a227; --moss:#7a9b52;
    --blood:#a44242; --sky:#5c86a8; --violet:#8a6ea8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--ink);color:var(--parch);
    font:15px/1.45 "Iowan Old Style",Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;overscroll-behavior:none}
  .num{font-variant-numeric:tabular-nums}

  header{flex:0 0 auto;background:var(--panel);border-bottom:2px solid var(--edge);
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  .crown{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .crown h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.03em;color:var(--gold)}
  .purse{font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
  .purse span{color:var(--dim)}
  .doing{margin-top:8px}
  .doing-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
  .doing-row em{font-style:normal;color:var(--dim);font-size:12px}
  .bar{height:7px;margin-top:5px;background:#160f0a;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--moss);transition:width .1s linear}
  .bar.fight i{background:var(--blood)}
  .bar.stun i{background:var(--violet)}
  .styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .styles div{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:6px 7px;text-align:center}
  .styles div.act{border-color:var(--gold);color:var(--gold)}
  .styles .n{font-size:11px;color:var(--dim);display:block}
  .styles .v{font-size:14px}
  .weak{color:var(--moss)} .resist{color:var(--blood)}
  .idlemsg{color:var(--dim);font-size:13px;font-style:italic}

  main{flex:1 1 auto;overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
  h2{font-size:15px;margin:16px 0 8px;color:var(--gold);font-weight:600}
  h2:first-child{margin-top:2px}

  .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sk{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:6px 7px}
  .sk.max{border-color:var(--gold)}
  .sk .n{font-size:11px;color:var(--dim);display:block}
  .sk .v{font-size:17px;font-variant-numeric:tabular-nums}
  .sk .xpbar{height:3px;background:#160f0a;margin-top:3px}
  .sk .xpbar i{display:block;height:100%;background:var(--gold)}

  .group{border:1px solid var(--edge);border-radius:3px;margin-bottom:8px;overflow:hidden}
  .group>summary{list-style:none;cursor:pointer;padding:11px 12px;background:var(--panel);
    display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .group>summary::-webkit-details-marker{display:none}
  .group>summary .lv{font-weight:400;color:var(--dim);font-size:13px}
  .group[open]>summary{border-bottom:1px solid var(--edge)}
  .subhead{padding:6px 12px;background:#1e1813;font-size:12px;color:var(--dim);border-bottom:1px solid #1c1611}

  .act{width:100%;text-align:left;border:0;border-bottom:1px solid #1c1611;
    background:var(--panel2);color:var(--parch);font:inherit;padding:11px 12px;min-height:52px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .act:last-child{border-bottom:0}
  .act:active{background:#3a2f26}
  .act.on{background:#33402a;box-shadow:inset 3px 0 0 var(--moss)}
  .act.on.fight{background:#40292a;box-shadow:inset 3px 0 0 var(--blood)}
  .act[disabled]{color:#6b5f4f;background:#1e1813}
  .act .meta{font-size:12px;color:var(--dim);display:block;margin-top:2px}
  .act[disabled] .meta{color:#5a5044}
  .act .rt{font-size:12px;color:var(--dim);text-align:right;flex:0 0 auto;white-space:nowrap}

  .row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--panel);
    border:1px solid var(--edge);border-radius:3px;margin-bottom:6px}
  .row.done{border-color:var(--moss)}
  .row.ready{border-color:var(--gold)}
  .row .grow{flex:1 1 auto;min-width:0}
  /* The quantity strip can carry six buttons, which will not fit one phone
     line. It is the one row allowed to wrap; the buttons share the width. */
  .row.picks{flex-wrap:wrap;gap:6px}
  .row.picks button.mini{flex:1 1 auto}
  .row .grow b{display:block;font-weight:600}
  .row .grow span{font-size:12px;color:var(--dim)}
  .qty{font-variant-numeric:tabular-nums;color:var(--gold);font-size:16px;flex:0 0 auto}
  button.mini{flex:0 0 auto;border:1px solid var(--edge);background:var(--panel2);color:var(--parch);
    font:inherit;font-size:13px;padding:8px 11px;border-radius:3px;min-height:40px;min-width:56px}
  button.mini:active{background:#3a2f26}
  button.mini[disabled]{color:#5f5545;border-color:#332a22}
  button.mini.buy{color:var(--gold)}
  button.mini.eq{color:var(--sky)}
  .empty{color:var(--dim);font-style:italic;padding:14px 2px}

  .arena{position:sticky;top:0;z-index:4;box-shadow:0 -14px 0 var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:11px 12px;margin-bottom:10px}
  .hpline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .hpbar{height:9px;background:#160f0a;border:1px solid var(--edge);border-radius:2px;overflow:hidden;margin-bottom:9px}
  .hpbar i{display:block;height:100%;background:var(--moss);transition:width .15s}
  .task{background:#2a2418;border:1px solid var(--gold);border-radius:3px;padding:10px 12px;margin-bottom:10px}
  .task b{color:var(--gold)}
  .log{font-size:12px;color:var(--dim);max-height:210px;overflow-y:auto;line-height:1.55;
    background:#1b1611;border:1px solid var(--edge);border-radius:3px;padding:4px 8px}
  .log div{border-bottom:1px solid #221b15;padding:2px 0;display:flex;gap:7px}
  .log div:last-child{border-bottom:0}
  .log .tm{color:#6b5f4f;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .log .hit{color:var(--parch)} .log .hit b{color:var(--moss)}
  .log .miss{color:#6b5f4f}
  .log .hurt{color:#c98a8a} .log .hurt b{color:var(--blood)}
  .log .eat{color:var(--moss)}
  .log .kill{color:var(--gold)}
  .log .loot{color:var(--sky)}
  .log .task{color:var(--violet)}
  .log .dead{color:var(--blood);font-weight:600}
  .sess{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .sess div{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:6px 7px}
  .sess .n{font-size:11px;color:var(--dim);display:block}
  .sess .v{font-size:15px;font-variant-numeric:tabular-nums}

  .cap{height:8px;background:#160f0a;border:1px solid var(--edge);border-radius:2px;overflow:hidden;margin:6px 0 12px}
  .cap i{display:block;height:100%;background:var(--moss)}
  .cap i.warn{background:var(--gold)} .cap i.full{background:var(--blood)}
  .patch{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--panel);
    border:1px solid var(--edge);border-radius:3px;margin-bottom:6px}
  .patch.ready{border-color:var(--moss)}
  .patch .grow{flex:1 1 auto;min-width:0}
  .patch .grow b{display:block;font-weight:600}
  .patch .grow span{font-size:12px;color:var(--dim)}
  .patch .pbar{height:4px;background:#160f0a;margin-top:5px}
  .patch .pbar i{display:block;height:100%;background:var(--moss)}
  .boss{border-color:var(--violet)!important}
  .offer{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:9px 11px;margin-bottom:6px}
  .offer.sell{border-left:3px solid var(--gold)} .offer.buy{border-left:3px solid var(--sky)}
  .offer .top{display:flex;justify-content:space-between;align-items:baseline}
  .offer .top b{font-weight:600}
  .offer .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .offer .pbar{height:4px;background:#160f0a;margin:6px 0}
  .offer .pbar i{display:block;height:100%;background:var(--moss)}
  .offer .acts{display:flex;gap:6px}
  .up{color:var(--moss)} .down{color:var(--blood)}
  .savebox{width:100%;height:80px;background:#160f0a;color:var(--dim);border:1px solid var(--edge);
    border-radius:3px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:none}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
  .stats div{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:7px 8px}
  .stats .n{font-size:11px;color:var(--dim);display:block}
  .stats .v{font-size:16px;font-variant-numeric:tabular-nums}
  .pets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .pet{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:7px 8px;font-size:12px}
  .pet.got{border-color:var(--gold);color:var(--gold)}
  .buffs{font-size:12px;color:var(--violet);margin-bottom:8px}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
  .slot{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:7px 8px}
  .slot .n{font-size:11px;color:var(--dim);display:block}
  .slot .v{font-size:13px}
  .slot.none .v{color:#6b5f4f;font-style:italic}

  nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);
    border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;background:none;color:var(--dim);font:inherit;font-size:12px;padding:12px 2px;min-height:52px}
  nav button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
  nav button .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);vertical-align:2px;margin-left:3px}

  #toast{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));
    background:var(--panel2);border:1px solid var(--gold);border-radius:3px;padding:10px 12px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
  #toast.show{opacity:1}
  #wb{position:fixed;inset:0;background:rgba(10,7,5,.88);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  #wb.show{display:flex}
  #wb .card{background:var(--panel);border:1px solid var(--gold);border-radius:4px;padding:16px;max-width:340px;width:100%;max-height:80vh;overflow-y:auto}
  #wb h3{margin:0 0 8px;color:var(--gold);font-size:17px}
  #wb ul{margin:0 0 14px;padding-left:18px;font-size:14px}
  #wb button{width:100%;border:1px solid var(--edge);background:var(--panel2);color:var(--parch);
    font:inherit;padding:12px;border-radius:3px;min-height:48px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const APP_VERSION='5.6';   /* bumped every release; the updater reads this string */

/* ------------------------------------------------------------------
   Self-updating. The service worker serves the page network-first, so a
   new upload is normally picked up on the next launch. This adds an
   explicit check + one-tap apply for when you don't want to wait.
   ------------------------------------------------------------------ */
const Updater={
  supported:(typeof navigator!=='undefined')&&('serviceWorker' in navigator)
            &&location.protocol.indexOf('http')===0,
  state:'idle',      // idle | checking | current | ready | offline
  latest:null,
  async register(){
    if(!this.supported)return;
    try{await navigator.serviceWorker.register('./sw.js');}catch(e){this.supported=false;}
  },
  async check(){
    if(!this.supported){this.state='idle';return;}
    this.state='checking';repaint();
    try{
      const res=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw new Error('bad response');
      const text=await res.text();
      const m=text.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(!m)throw new Error('no version found');
      this.latest=m[1];
      this.state=(m[1]!==APP_VERSION)?'ready':'current';
    }catch(e){this.state='offline';}
    repaint();
  },
  async apply(){
    if(this.state!=='ready')return;
    await save();                              // never update over unsaved progress
    try{
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }catch(e){}
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');await reg.update();}
    }catch(e){}
    location.reload();
  }
};
/* ============================================================
   XP TABLE — the classic curve, levels 1..99
   ============================================================ */
const XP=[0];
(function(){let t=0;for(let l=1;l<99;l++){t+=Math.floor(l+300*Math.pow(2,l/7));XP.push(Math.floor(t/4));}})();
function lvlFor(xp){let l=1;while(l<99&&XP[l]<=xp)l++;return l;}
function xpInto(xp){const l=lvlFor(xp);if(l>=99)return{pct:100};
  const a=XP[l-1],b=XP[l];return{pct:((xp-a)/(b-a))*100};}

function delveFoe(d,floor){
  const t=d.tmpl;
  const m =1+floor*d.step;          // health and reward scale fully
  const md=1+floor*d.step*0.45;     // damage scales far slower — deep floors stay survivable
  const ml=1+floor*d.step*0.55;     // level scales in between
  return{id:d.id+'#'+floor,delve:1,n:`${d.n} · floor ${floor+1}/${d.floors}`,weak:d.weak,
    lvl:Math.round(t.lvl*ml),hp:Math.round(t.hp*m),max:Math.round(t.max*md),spd:t.spd,
    xp:Math.round(t.xp*m),gp:[Math.round(t.gp[0]*m),Math.round(t.gp[1]*m)],drop:t.drop};
}

/* ------------------------------------------------------------------
   Storage adapter. Inside Claude we use window.storage. Installed as a
   PWA or opened as a plain file there is no such thing, so fall back to
   localStorage, then to memory. localStorage is only probed when
   window.storage is absent, so the artifact path never touches it.
   ------------------------------------------------------------------ */
const Store=(function(){
  const mem={};
  const artifact=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
  let local=false;
  if(!artifact){
    try{localStorage.setItem('__hm_probe','1');localStorage.removeItem('__hm_probe');local=true;}
    catch(e){local=false;}
  }
  return{
    mode:artifact?'Claude':local?'this device':'memory only (nothing will persist)',
    persistent:artifact||local,
    async get(k){
      if(artifact){try{const r=await window.storage.get(k);return r&&r.value!==undefined?r.value:null;}catch(e){return null;}}
      if(local){try{return localStorage.getItem(k);}catch(e){return null;}}
      return mem[k]!==undefined?mem[k]:null;
    },
    async set(k,v){
      if(artifact){try{await window.storage.set(k,v);return true;}catch(e){return false;}}
      if(local){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
      mem[k]=v;return true;
    },
    async del(k){
      if(artifact){try{await window.storage.delete(k);return true;}catch(e){return false;}}
      if(local){try{localStorage.removeItem(k);return true;}catch(e){return false;}}
      delete mem[k];return true;
    },
  };
})();

function driftMarket(){

  const ids=new Set([...Object.keys(S.bank),...Object.keys(S.market),
    ...(S.offers||[]).map(o=>o.id),...BUYABLE]);
  for(const id of ids){
    if(!I[id]&&!EQ[id])continue;
    let m=marketMul(id);
    m+=(Math.random()-0.5)*0.09;

function fillOffers(){
  if(!S.offers)return;
  for(const o of S.offers){
    if(o.filled>=o.qty)continue;
    const mkt=marketPrice(o.id);
    const ratio=o.kind==='sell'?mkt/o.price:o.price/mkt;   // above 1 means your price is attractive
    const speed=ratio>=1?0.28*Math.min(2.5,ratio):0.28*Math.pow(ratio,4);
    const want=Math.floor(o.qty*speed*(0.6+Math.random()*0.8));
    if(want<=0)continue;
    const take=Math.min(want,o.qty-o.filled);
    if(o.kind==='sell'){o.filled+=take;S.gp+=take*o.price;o.got=(o.got||0)+take*o.price;}
    else{const g=add(o.id,take);o.filled+=g;o.got=(o.got||0)+g;if(g<take)break;}
  }
  const done=S.offers.filter(o=>o.filled>=o.qty);
  if(done.length){
    for(const o of done)pushLog(`${o.kind==='sell'?'Sold':'Bought'} ${fmt(o.qty)}× ${item(o.id).n}`,'loot');
    if(gains)gains.trades=(gains.trades||0)+done.length;
  }
  S.offers=S.offers.filter(o=>o.filled<o.qty);
}

/* Bank capacity is SLOTS — distinct item types. Stacks are unlimited, the way
   they are in RuneScape. An over-cap save (from before the switch) keeps

   nobody loses anything on the changeover. */
function bankCap(){return BANK_TIERS[S.bankTier||0]+room('storeroom')*8;}
function bankUsed(){let n=0;for(const k in S.bank)if(S.bank[k]>0)n++;return n;}

// How many free slots a set of incoming ids would consume.
function slotsFor(ids){let n=0;for(const id of ids)if(!S.bank[id])n++;return n;}
function add(id,n){
  if(!hasSlot(id)){pushLog(`No free bank slot — ${n}× ${item(id).n} lost`,'miss');return 0;}
  S.bank[id]=(S.bank[id]||0)+n;

}
function take(id,n){S.bank[id]=(S.bank[id]||0)-n;if(S.bank[id]<=0)delete S.bank[id];}
/* Only strip the item off you if the last one actually left the bank — the old
   sell-everything handler could unequip on a partial sale. */
function unequipIfGone(id){if(!have(id)&&EQ[id]&&S.equip[EQ[id].slot]===id)S.equip[EQ[id].slot]=null;}
function vendor(id,n){
  n=Math.min(n,have(id));if(n<=0)return;
  const val=Math.floor(item(id).v*0.7)*n;
  take(id,n);unequipIfGone(id);
  S.gp+=val;toast(`Vendored ${fmt(n)}× ${item(id).n} for ${fmt(val)} gp`);
}
function listOffer(id,n){
  n=Math.min(n,have(id));if(n<=0)return;
  if((S.offers||[]).length>=GE_SLOTS){toast('No free offer slots');return;}
  take(id,n);unequipIfGone(id);
  S.offers.push({kind:'sell',id,qty:n,filled:0,price:marketPrice(id)});

function buyOffer(id,n){
  if((S.offers||[]).length>=GE_SLOTS){toast('No free offer slots');return;}
  // A buy offer delivers through add() whenever it fills, which could be hours
  // later. Refuse it now rather than have the gold spent and the goods dropped
  // on arrival because there was no slot waiting.
  if(!hasSlot(id)){toast(`No free bank slot for ${item(id).n}`);return;}
  const price=marketPrice(id);

function tick(dt){
  S.played=(S.played||0)+dt;
  farmTick(dt);buffTick(dt);geTick(dt);
  if(S.stun>0){S.stun=Math.max(0,S.stun-dt);if(S.stun>0)return;}
  const cur=findAct(S.act);
  if(!cur)return;
  if(cur.skill==='fight'||cur.skill==='delve'){fightTick(dt,cur.foe);return;}
  const{skill,a}=cur;
  if(lvl(skill)<a.lvl){S.act=null;return;}
  S.prog+=dt;
  const dur=actDur(skill,a);
  let guard=0;
  while(S.prog>=dur&&guard++<600){
    if(!canPay(a.in)){S.prog=0;if(!gains)toast('Out of materials');S.act=null;return;}
    if(a.out&&slotsFor(Object.keys(a.out))>bankCap()-bankUsed()){
      S.prog=0;if(!gains)toast('No free bank slot');S.act=null;return;}
    S.prog-=dur;
    if(a.fail!==undefined&&Math.random()<a.fail){
      grantXp(skill,Math.round(a.xp*0.15));
      S.stun=a.stun;
      if(gains)gains.fails=(gains.fails||0)+1;else pushLog('Caught — stunned');
      return;
    }
    if(a.in)for(const k in a.in)take(k,a.in[k]);
    if(a.out)for(const k in a.out){add(k,a.out[k]);noteItem(k,a.out[k]);}
    if(a.gp)gainGp(a.gp[0]+Math.floor(Math.random()*(a.gp[1]-a.gp[0]+1)));
    if(a.rare&&Math.random()<a.rare.c){add(a.rare.id,1);noteItem(a.rare.id,1);
      if(!gains)toast(`Found ${item(a.rare.id).n}`);}

function fightTick(dt,foe){
  if(!foe)return;
  if(S.foe!==foe.id){S.foe=foe.id;S.foeHp=foe.hp;S.prog=0;S.foeTimer=0;}
  S.prog+=dt;S.foeTimer+=dt;
  const G=gear(),P=prayerBonus();
  drinkIfNeeded();
  // Top up before swinging — walking into a fight at 10/90 hp should not be a death sentence.
  let guardEat=0;
  while(S.hp<maxHp()*0.5&&guardEat++<40){
    const before=S.hp;autoEat();
    if(S.hp===before)break;      // no food, or food that heals nothing
  }
  let st=style();
  let guard=0;
  while(S.prog>=G.spd&&guard++<600){
    S.prog-=G.spd;
    let ammo=null;
    if(ammoKind(st)){
      ammo=bestAmmo(st);
      if(!ammo){                                   // out of ammo — swing bare-handed
        if(!S.warnedAmmo){pushLog(`Out of ${ammoKind(st)}s — fighting unarmed`,'dead');S.warnedAmmo=1;}
        st='melee';
      }else{S.warnedAmmo=0;}
    }
    const match=foe.weak===st;
    const tri=match?.12:(foe.weak?-.06:0);
    const hitChance=Math.max(.25,Math.min(.95,.62+(styleLvl(st)-foe.lvl)*.012+buffTotal('acc')/100+tri));
    S.sess.swings++;
    if(ammo)take(ammo,1);
    if(Math.random()<hitChance){
      const maxHit=maxHitFor(st,G,P,ammo)+(match?2:0);
      const roll=1+Math.floor(Math.random()*maxHit);
      const dmg=Math.min(roll,S.foeHp);           // overkill earns nothing
      S.foeHp-=dmg;
      S.sess.hits++;S.sess.dealt+=dmg;
      if(st==='melee'){grantXp('attack',Math.round(dmg*1.33));grantXp('strength',Math.round(dmg*1.33));}
      else grantXp(st,Math.round(dmg*2.66));
      grantXp('hitpoints',Math.round(dmg*0.45));
      pushLog(`${st==='melee'?'You hit':st==='ranged'?'Your arrow hits':'Your spell hits'} <b>${dmg}</b> on ${foe.n}${match?' <span class="weak">(weak to '+st+')</span>':''}${roll>dmg?' (overkill '+(roll-dmg)+')':''} — ${Math.max(0,S.foeHp)} hp left`,'hit');
      if(S.foeHp<=0){
        grantXp('defence',foe.xp);
        S.kills[foe.id]=(S.kills[foe.id]||0)+1;S.sess.kills++;
        const gp=gainGp(foe.gp[0]+Math.floor(Math.random()*(foe.gp[1]-foe.gp[0]+1)));
        S.sess.gp+=gp;
        const drops=[];
        for(const k in foe.drop){add(k,foe.drop[k]);noteItem(k,foe.drop[k]);drops.push(`${foe.drop[k]}× ${item(k).n}`);}
        // Rare table. Each entry rolls independently, so a foe can pay out more
        // than one. These join the normal loot line rather than announcing
        // themselves — noteItem still books them into the offline summary.
        for(const r of rareTable(foe)){
          if(Math.random()<r.c){const n=r.n||1;add(r.id,n);noteItem(r.id,n);drops.push(`${n}× ${item(r.id).n}`);}
        }
        pushLog(`${foe.n} dies — kill ${S.kills[foe.id]}, +${foe.xp} defence xp`,'kill');
        pushLog(`Loot: ${gp} gp${drops.length?', '+drops.join(', '):''}`,'loot');
        if(foe.delve){
          const d=DUNGEONS.find(x=>x.id===foe.id.split('#')[0]);
          S.delve.floor++;
          if(S.delve.floor>=d.floors){
            grantXp('slayer',d.bonusXp);
            const bg=gainGp(d.bonusGp);
            if(Math.random()<d.ringC){add(d.ring,1);noteItem(d.ring,1);
              pushLog(`${item(d.ring).n} drops!`,'kill');
              if(gains)gains.uniques=(gains.uniques||0)+1;else toast(`${item(d.ring).n}!`);}
            pushLog(`${d.n} cleared — ${fmt(d.bonusXp)} slayer xp, ${fmt(bg)} gp`,'task');
            if(gains)gains.delves=(gains.delves||0)+1;else toast(`${d.n} cleared`);
            S.delve=null;S.act=null;S.foe=null;S.foeHp=0;
          }else pushLog(`Descending to floor ${S.delve.floor+1} of ${d.floors}`,'task');
          return;
        }
        if(foe.boss){
          S.bossKills[foe.id]=(S.bossKills[foe.id]||0)+1;
          if(Math.random()<foe.unique.c){add(foe.unique.id,1);noteItem(foe.unique.id,1);
            pushLog(`${item(foe.unique.id).n} drops!`,'kill');
            if(gains)gains.uniques=(gains.uniques||0)+1;else toast(`${item(foe.unique.id).n}!`);}
          else pushLog('No unique this time','miss');
          S.act=null;S.foe=null;S.foeHp=0;
          if(!gains)toast(`${foe.n} defeated — spend another sigil to re-enter`);
          return;
        }
        if(S.task&&S.task.foe===foe.id&&S.task.done<S.task.need){
          S.task.done++;
          if(S.task.done>=S.task.need)finishTask();
          else pushLog(`Slayer task ${S.task.done} / ${S.task.need}`,'task');
        }
        S.foeHp=foe.hp;
        rollPet('combat',6000);
        maybeEvent();
      }
    }else{
      pushLog(`You miss ${foe.n}${(!match&&foe.weak)?' — it resists '+st:''}`,'miss');
    }
  }
  guard=0;
  while(S.foeTimer>=foe.spd&&guard++<600){
    S.foeTimer-=foe.spd;
    const raw=Math.floor(Math.random()*(foe.max+1));
    const blocked=Math.floor((G.def+buffTotal('def'))/8)+P.soak;
    let dmg=raw-blocked;
    if(dmg>0){
      S.hp-=dmg;S.sess.taken+=dmg;
      pushLog(`${foe.n} hits <b>${dmg}</b>${blocked>0?` (armour absorbed ${Math.min(blocked,raw)})`:''} — ${Math.max(0,S.hp)} hp left`,'hurt');
      // Order matters: a lethal blow kills outright. Eating must never revive you
      // from below zero, or food makes you immortal.
      if(S.hp<=0){
        const lost=Math.floor(S.gp*.15);S.gp-=lost;S.hp=maxHp();S.act=null;S.foe=null;
        S.sess.deaths++;
        if(S.delve){pushLog(`Run ended on floor ${S.delve.floor+1} — completion bonus forfeit`,'dead');S.delve=null;}
        if(gains)gains.died=true;else pushLog(`You died to ${foe.n}. Lost ${lost} gp.`,'dead');
        return;
      }
      if(S.hp<=maxHp()*.45)autoEat();
      // Retreat before a hit that COULD kill, not at a flat percentage — otherwise a
      // hard-hitting foe jumps straight over the safety net.
      const lethal=Math.max(1,foe.max-blocked);
      if(S.hp<=Math.max(maxHp()*.30,lethal)&&!Object.keys(S.bank).some(k=>I[k]&&I[k].heal&&S.bank[k]>0)){
        S.act=null;S.foe=null;
        pushLog('Out of food — retreated before dying','dead');
        if(gains)gains.retreated=true;else toast('Retreated — no food left');
        if(S.delve)S.delve=null;
        return;
      }
    }else if(raw>0){
      pushLog(`${foe.n} attacks — armour absorbs it`,'miss');
    }else{
      pushLog(`${foe.n} misses`,'miss');
    }
  }
}
function autoEat(){
  const foods=Object.keys(S.bank).filter(k=>I[k]&&I[k].heal);
  if(!foods.length)return;
  foods.sort((x,y)=>I[x].heal-I[y].heal);
  const need=maxHp()-S.hp;
  const pick=foods.find(f=>I[f].heal>=need)||foods[foods.length-1];
  const before=S.hp;
  const healed=Math.round(I[pick].heal*(1+room('kitchen')*0.25));
  take(pick,1);S.hp=Math.min(maxHp(),S.hp+healed);S.sess.eaten++;
  pushLog(`Ate ${I[pick].n} — healed ${S.hp-before} to ${S.hp} hp (${have(pick)} left)`,'eat');
}

/* ---- Slayer ---- */
function rollTask(){
  const cl=combatLvl();
  // Eligible by ceiling, then narrowed by a floor so combat 99 stops being
  // handed giant rats. If the floor empties the pool — high combat, no content
  // that high yet — fall back to the three hardest things that are eligible
  // rather than the whole list, which would put the rat back on the table.
  // Assumes FOES stays sorted by level; keep new entries in order.
  const elig=FOES.filter(f=>f.lvl<=cl+8);
  const banded=elig.filter(f=>f.lvl>=cl-25);
  const pool=banded.length?banded:elig.slice(-3);
  const foe=pool[Math.floor(Math.random()*pool.length)]||FOES[0];
  const need=8+Math.floor(Math.random()*18);
  S.task={foe:foe.id,need,done:0};
  return S.task;
}
function finishTask(){
  const foe=FOES.find(f=>f.id===S.task.foe);
  const bonus=Math.round(foe.xp*S.task.need*0.9);
  const gp=Math.round(foe.gp[1]*S.task.need*0.6);
  grantXp('slayer',bonus);gainGp(gp);
  if(gains)gains.tasks=(gains.tasks||0)+1;
  else{pushLog(`Task complete — ${S.task.need}× ${foe.n} for ${fmt(bonus)} slayer xp and ${fmt(gp)} gp`,'task');
    toast(`Task done — ${fmt(bonus)} slayer xp`);}
  if(Math.random()<.35){add('boss_sigil',1);noteItem('boss_sigil',1);
    if(!gains)pushLog('A boss sigil falls from the reward','loot');}
  S.task=null;
  rollTask();
}

/* ---- Quests ---- */
function questState(q){
  if(S.quests[q.id])return'done';
  const n=q.need;
  if(n.lvl)for(const k in n.lvl)if(lvl(k)<n.lvl[k])return'locked';
  if(n.kills)for(const k in n.kills)if((S.kills[k]||0)<n.kills[k])return'locked';
  if(n.items)for(const k in n.items)if(have(k)<n.items[k])return'locked';
  return'ready';
}
function claimQuest(q){
  if(questState(q)!=='ready')return;
  if(q.need.items)for(const k in q.need.items)take(k,q.need.items[k]);
  if(q.reward.xp)for(const k in q.reward.xp)grantXp(k,q.reward.xp[k]);
  if(q.reward.items)for(const k in q.reward.items)add(k,q.reward.items[k]);
  if(q.reward.gp)S.gp+=q.reward.gp;
  S.quests[q.id]=1;
  toast(`Quest complete — ${q.n}`);
}
function questsReady(){return QUESTS.some(q=>questState(q)==='ready');}

/* ============================================================
   OFFLINE
   ============================================================ */
const OFFLINE_CAP=12*3600*1000;
function catchUp(){
  const now=Date.now();
  let elapsed=Math.min(now-(S.last||now),OFFLINE_CAP);
  S.last=now;
  if(elapsed<20000)return null;
  const ripeBefore=S.farm.filter(p=>p.crop&&p.ms<=0).length;
  gains={xp:{},items:{},gp:0,died:false,events:0,fails:0,tasks:0,capes:[],ms:elapsed};
  const step=250;let guard=0;
  while(elapsed>0&&S.act&&guard++<300000){const d=Math.min(step,elapsed);tick(d);elapsed-=d;}
  // crops and potion timers keep running even with no skill set, or after one stops
  if(elapsed>0){farmTick(elapsed);buffTick(elapsed);geTick(elapsed);}
  gains.ripened=S.farm.filter(p=>p.crop&&p.ms<=0).length-ripeBefore;
  const out=gains;gains=null;return out;
}
function showCatchUp(r){
  if(!r)return;
  const li=[];const hrs=r.ms/3600000;
  li.push(`<li>Away ${hrs>=1?hrs.toFixed(1)+' hours':Math.round(r.ms/60000)+' minutes'}</li>`);
  for(const k in r.xp)if(r.xp[k]>0)li.push(`<li>${label(k)} +${fmt(Math.round(r.xp[k]))} xp</li>`);
  for(const k in r.items)li.push(`<li>${item(k).n} ×${fmt(r.items[k])}</li>`);
  if(r.gp)li.push(`<li>${fmt(r.gp)} gp</li>`);
  if(r.tasks)li.push(`<li>${r.tasks} slayer task${r.tasks>1?'s':''} finished</li>`);
  if(r.ripened>0)li.push(`<li>${r.ripened} crop${r.ripened>1?'s':''} ready to harvest</li>`);
  if(r.trades)li.push(`<li>${r.trades} market offer${r.trades>1?'s':''} completed</li>`);
  for(const pn of (r.pets||[]))li.push(`<li><b>Pet found: ${pn}</b></li>`);
  if(r.retreated)li.push(`<li>Retreated from combat — you ran out of food</li>`);
  if(r.delves)li.push(`<li>${r.delves} dungeon${r.delves>1?'s':''} cleared</li>`);
  if(r.uniques)li.push(`<li><b>${r.uniques} boss unique dropped</b></li>`);
  if(r.events)li.push(`<li>${r.events} chance encounter${r.events>1?'s':''}</li>`);
  for(const c of r.capes)li.push(`<li><b>${label(c)} 99 — cape earned</b></li>`);
  if(r.died)li.push(`<li>You died at some point. Bring more food.</li>`);
  if(li.length<2)return;
  document.getElementById('wblist').innerHTML=li.join('');
  document.getElementById('wb').classList.add('show');
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
let curSlot=1;
let slotInfo=[null,null,null];

function summarize(o){
  try{
    if(typeof o==='string')o=JSON.parse(o);
    if(!o||!o.xp)return null;
    let tl=0;for(const k of ALL_SKILLS)tl+=lvlFor(o.xp[k]||0);
    return{lvl:tl,gp:o.gp||0,played:o.played||0,last:o.last||0,pets:Object.keys(o.pets||{}).length};
  }catch(e){return null;}
}
async function save(){
  S.last=Date.now();
  const okw=await Store.set(slotKey(curSlot),JSON.stringify(S));
  await Store.set(META,JSON.stringify({slot:curSlot}));
  slotInfo[curSlot-1]=summarize(S);
  if(!okw)console.error('save failed');
  return okw;
}
async function refreshSlots(){
  for(let i=1;i<=SLOTS_N;i++){
    const raw=await Store.get(slotKey(i));
    slotInfo[i-1]=raw?summarize(raw):null;
  }
}
function adopt(p){
  const f=fresh();
  S=Object.assign(f,p);
  S.xp=Object.assign(fresh().xp,p.xp||{});
  S.equip=Object.assign(fresh().equip,p.equip||{});
  S.sess=Object.assign(fresh().sess,p.sess||{});
  S.house=Object.assign(fresh().house,p.house||{});
  S.farm=Array.isArray(p.farm)?p.farm:f.farm;
  S.offers=Array.isArray(p.offers)?p.offers:[];
  S.market=p.market||{};S.pets=p.pets||{};
  S.buffs=p.buffs||{};S.bossKills=p.bossKills||{};S.delve=p.delve||null;
  S.patches=p.patches||3;S.bankTier=p.bankTier||0;
  S.geMs=p.geMs||0;S.played=p.played||0;S.started=p.started||Date.now();
  while(S.farm.length<totalPatches())S.farm.push({crop:null,ms:0});
}
async function loadSlot(i){
  await save();                       // never lose the slot you are leaving
  curSlot=i;
  const raw=await Store.get(slotKey(i));
  if(raw){try{adopt(JSON.parse(raw));}catch(e){S=fresh();}}
  else S=fresh();
  if(!S.task)rollTask();
  await Store.set(META,JSON.stringify({slot:curSlot}));
  await refreshSlots();
  return true;
}
async function load(){
  try{const m=await Store.get(META);if(m){const o=JSON.parse(m);
    if(o&&o.slot>=1&&o.slot<=SLOTS_N)curSlot=o.slot;}}catch(e){}
  const raw=await Store.get(slotKey(curSlot));
  if(raw){try{adopt(JSON.parse(raw));await refreshSlots();return true;}catch(e){}}
  try{                                // migrate a pre-slots save into slot 1
    const legacy=await Store.get(SAVE);
    if(legacy){const p=JSON.parse(legacy);
      if(p&&p.xp){adopt(p);curSlot=1;await save();await refreshSlots();return true;}}
  }catch(e){}
  S=fresh();await refreshSlots();return false;
}
async function wipe(){
  await Store.del(slotKey(curSlot));
  S=fresh();rollTask();await refreshSlots();render();toast('Slot cleared');
}

let tab='train',openGroups=new Set();
/* Which bank row has its quantity strip open, {id,mode}. Deliberately not on S
   — it is throwaway UI state and has no business in the save file. */
let pick=null;
const $=id=>document.getElementById(id);
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'m':n>=1e4?Math.floor(n/1e3)+'k':String(Math.round(n));

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}

function renderDoing(){
  const el=$('doing');
  if(S.stun>0){
    el.innerHTML=`<div class="doing-row"><b>Stunned</b><em>${(S.stun/1000).toFixed(1)}s</em></div>
      <div class="bar stun"><i style="width:100%"></i></div>`;return;
  }
  const cur=findAct(S.act);
  if(!cur){el.innerHTML='<div class="idlemsg">Idle — pick something to train.</div>';return;}
  if(cur.skill==='delve'){
    const f=cur.foe,pct=Math.max(0,(S.foeHp/f.hp)*100);
    el.innerHTML=`<div class="doing-row"><b>${f.n}</b><em>${S.hp}/${maxHp()} hp</em></div>
      <div class="bar fight"><i style="width:${pct}%"></i></div>`;return;
  }
  if(cur.skill==='fight'){
    const f=cur.foe,pct=Math.max(0,(S.foeHp/f.hp)*100);
    el.innerHTML=`<div class="doing-row"><b>Fighting ${f.n}</b><em>${S.hp}/${maxHp()} hp</em></div>
      <div class="bar fight"><i style="width:${pct}%"></i></div>`;return;
  }
  const{skill,a}=cur,dur=actDur(skill,a);
  el.innerHTML=`<div class="doing-row"><b>${a.n}</b>
    <em>${fmt(a.xp/(dur/1000)*3600)} xp/hr</em></div>
    <div class="bar"><i style="width:${Math.min(100,(S.prog/dur)*100)}%"></i></div>`;
}

function skillStrip(){
  return `<div class="skills">${ALL_SKILLS.map(k=>{
    const l=lvlFor(S.xp[k]||0),p=xpInto(S.xp[k]||0);
    return `<div class="sk${l>=99?' max':''}"><span class="n">${label(k)}</span>
      <span class="v num">${l}</span><div class="xpbar"><i style="width:${p.pct}%"></i></div></div>`;
  }).join('')}</div>`;
}

function actRow(key,a,ok,on){
  const dur=actDur(key,a);
  const needs=a.in?Object.keys(a.in).map(k=>`${a.in[k]}× ${item(k).n}`).join(', '):'';
  const short=a.in&&!canPay(a.in);
  const bits=[];
  if(needs)bits.push(needs+(short?' — none in bank':''));
  if(a.gp)bits.push(`${a.gp[0]}–${a.gp[1]} gp`);
  if(a.fail)bits.push(`${Math.round(a.fail*100)}% caught`);
  if(a.out&&!a.in)bits.push(Object.keys(a.out).map(k=>item(k).n).join(', '));
  return `<button class="act${on?' on':''}" ${ok?'':'disabled'} data-go="${key}:${a.id}">
    <span><span>${a.n}</span><span class="meta">${ok?(bits.join(' · ')||'—'):'Requires level '+a.lvl}</span></span>
    <span class="rt">${fmt(a.xp)} xp<br>${(dur/1000).toFixed(1)}s</span></button>`;
}

function viewTrain(){
  let h=`<h2>Levels &middot; combat ${combatLvl()}</h2>${skillStrip()}
    <h2>Equipment</h2><div class="slots">`;
  for(const sl of SLOTS){
    const id=S.equip[sl];
    h+=`<div class="slot${id?'':' none'}"><span class="n">${cap0(sl)}</span>
      <span class="v">${id?EQ[id].n:'empty'}</span></div>`;
  }
  const G=gear(),P=prayerBonus();
  h+=`</div><div class="row"><div class="grow"><b>+${G.str} strength &middot; +${G.def} defence</b>
    <span>Prayer adds +${P.hit} max hit and soaks ${P.soak} damage</span></div></div>`;

  h+=`<h2>Farm &middot; ${totalPatches()} patches</h2>`;
  const fl=lvl('farming');
  S.farm.forEach((pt,i)=>{
    if(i>=totalPatches())return;
    if(!pt.crop){
      const sown=CROPS.filter(c=>fl>=c.lvl&&have(c.seed)>0);
      h+=`<div class="patch"><div class="grow"><b>Empty patch</b>
        <span>${sown.length?'Ready to sow':'No usable seeds — buy some in the shop'}</span></div>
        ${sown.length?`<button class="mini buy" data-sow="${i}">Sow ${sown[sown.length-1].n}</button>`:''}</div>`;
    }else{
      const c=CROPS.find(x=>x.id===pt.crop),ready=pt.ms<=0;
      const pct=ready?100:(1-pt.ms/c.ms)*100;
      const mins=Math.ceil(pt.ms/60000);
      h+=`<div class="patch${ready?' ready':''}"><div class="grow"><b>${c.n}</b>
        <span>${ready?'Ready to harvest':`${mins} min remaining`}</span>
        <div class="pbar"><i style="width:${pct}%"></i></div></div>
        <button class="mini ${ready?'buy':''}" data-harvest="${i}" ${ready?'':'disabled'}>${ready?'Harvest':'Growing'}</button></div>`;
    }
  });
  h+=`<h2>Train a skill</h2>`;
  for(const key in SKILLS){
    const s=SKILLS[key],L=lvl(key);

    h+=`<details class="group"${open}><summary>${s.n}<span class="lv num">lv ${L}</span></summary>`;
    for(const a of s.acts){
      if(a.sub){h+=`<div class="subhead">${a.sub}</div>`;continue;}
      h+=actRow(key,a,L>=a.lvl,S.act===key+':'+a.id);
    }
    h+=`</details>`;
  }
  h+=`<h2>Danger zone</h2><div class="row"><div class="grow"><b>Reset save</b>
    <span>Wipes everything, permanently</span></div>
    <button class="mini" data-wipe="1">Reset</button></div>`;
  return h;
}

  for(const f of BOSSES){

        :`${f.hp} hp &middot; hits up to ${f.max} &middot; ${Math.round(f.unique.c*100)}% ${item(f.unique.id).n} &middot; slain ${S.bossKills[f.id]||0}
        &middot; <span class="${f.weak===st?'weak':'resist'}">weak to ${f.weak}</span>`}</span></span>

  h+=`<h2>Dungeons</h2>`;

    const d=DUNGEONS.find(x=>x.id===S.delve.id);

  }
  for(const d of DUNGEONS){
    const cl=combatLvl(),locked=cl<d.req,on=S.delve&&S.delve.id===d.id;

      <span><span>${d.n}</span><span class="meta">${locked?`Needs combat ${d.req} — you are ${cl}`
        :`${d.floors} floors &middot; <span class="${d.weak===st?'weak':'resist'}">weak to ${d.weak}</span> &middot; ${Math.round(d.ringC*100)}% ${item(d.ring).n}`}</span></span>
      <span class="rt">${fmt(d.bonusXp)} xp<br>${fmt(d.bonusGp)} gp</span></button>`;
  }
  h+=`<h2>Combat log</h2>`;
  h+=`<div class="log">${S.log.length?S.log.map(l=>{
    if(typeof l==='string')return `<div><span class="hit">${l}</span></div>`;
    return `<div><span class="tm">${l.s||''}</span><span class="${l.k}">${l.t}</span></div>`;
  }).join(''):'<div><span class="miss">Nothing yet.</span></div>'}</div>
  <div class="row" style="margin-top:8px"><div class="grow"><b>Combat log</b>

  if(S.task){
    const f=FOES.find(x=>x.id===S.task.foe);
    h+=`<div class="task"><b>Slayer task</b> — ${S.task.done} / ${S.task.need} ${f.n}
      <div style="margin-top:6px"><button class="mini" data-skiptask="1">Skip task</button></div></div>`;
  }
  const food=Object.keys(S.bank).filter(k=>I[k]&&I[k].heal).reduce((n,k)=>n+S.bank[k],0);
  h+=`<h2>Choose a foe</h2>`;
  if(!food)h+=`<div class="empty">No cooked food banked. You will die eventually.</div>`;
  for(const f of FOES){
    const on=S.act==='fight:'+f.id;
    const isTask=S.task&&S.task.foe===f.id;
    h+=`<button class="act${on?' on fight':''}" data-go="fight:${f.id}">
      <span><span>${f.n}${isTask?' &middot; task':''}</span>
      <span class="meta">${f.hp} hp &middot; hits up to ${f.max} &middot; ${fmt(f.gp[0])}–${fmt(f.gp[1])} gp &middot; killed ${S.kills[f.id]||0}
      ${f.weak?`&middot; <span class="${f.weak===st?'weak':'resist'}">weak to ${f.weak}</span>`:''}
      ${rareTable(f).map(r=>`&middot; ${(r.c*100).toFixed(1)}% ${item(r.id).n}`).join('')}</span></span>
      <span class="rt">lv ${f.lvl}<br>${f.xp} xp</span></button>`;
  }
  return h;
}

function viewQuests(){
  let h=`<h2>Quests</h2>`;
  for(const q of QUESTS){
    const st=questState(q);
    const parts=[];
    if(q.need.lvl)for(const k in q.need.lvl)parts.push(`${label(k)} ${lvl(k)}/${q.need.lvl[k]}`);
    if(q.need.kills)for(const k in q.need.kills){const f=FOES.find(x=>x.id===k);
      parts.push(`${f.n} ${Math.min(S.kills[k]||0,q.need.kills[k])}/${q.need.kills[k]}`);}
    if(q.need.items)for(const k in q.need.items)parts.push(`${item(k).n} ${Math.min(have(k),q.need.items[k])}/${q.need.items[k]}`);
    const rw=[];
    if(q.reward.xp)for(const k in q.reward.xp)rw.push(`${fmt(q.reward.xp[k])} ${label(k).toLowerCase()} xp`);
    if(q.reward.items)for(const k in q.reward.items)rw.push(item(k).n);
    if(q.reward.gp)rw.push(`${fmt(q.reward.gp)} gp`);
    h+=`<div class="row ${st}"><div class="grow"><b>${q.n}</b>
      <span>${st==='done'?'Completed':q.blurb}<br>${st==='done'?'':parts.join(' &middot; ')}
      <br>Reward: ${rw.join(', ')}</span></div>
      ${st==='done'?'':`<button class="mini buy" data-quest="${q.id}" ${st==='ready'?'':'disabled'}>${st==='ready'?'Claim':'…'}</button>`}
    </div>`;
  }
  return h;
}

/* One quantity strip, shared by the bank, the exchange and the shop. `max` is
   whatever bounds the choice: stock held when selling, gold affordable when
   buying. Buttons rather than a number input, to match the rest of the app. */
function pickStrip(id,mode,unit,max,note){
  if(!(pick&&pick.id===id&&pick.mode===mode))return '';
  const label={sell:'Vendor',list:'List',order:'Buy',shop:'Buy'}[mode];
  const cancel=`<button class="mini" data-pickcancel="1">Cancel</button>`;
  if(max<1)return `<div class="row"><div class="grow"><b>${label} how many?</b>
    <span>${note}</span></div>${cancel}</div>`;
  const opts=[1,10,100,1000,10000].filter(q=>q<max);opts.push(max);
  const allLabel=(mode==='sell'||mode==='list')?`All ${fmt(max)}`:`Max ${fmt(max)}`;
  return `<div class="row"><div class="grow"><b>${label} how many?</b>
    <span>${fmt(unit)} gp each &middot; ${note}</span></div></div>
    <div class="row picks">${opts.map(q=>`<button class="mini buy" data-pickqty="${q}">${q===max?allLabel:fmt(q)}</button>`).join('')}
    ${cancel}</div>`;
}

function viewBank(){
  const used=bankUsed(),cap=bankCap(),pctc=(used/cap)*100;
  const capbar=`<div class="cap"><i class="${pctc>=100?'full':pctc>80?'warn':''}" style="width:${Math.min(100,pctc)}%"></i></div>`;
  const keys=Object.keys(S.bank).filter(k=>S.bank[k]>0);
  if(!keys.length)return `<h2>Bank &middot; ${used} / ${cap} slots</h2>${capbar}<div class="empty">Empty. Go chop something.</div>`;
  keys.sort((a,b)=>item(a).n.localeCompare(item(b).n));
  const worth=keys.reduce((n,k)=>n+item(k).v*S.bank[k],0);
  let h=`<h2>Bank &middot; ${used} / ${cap} slots &middot; worth ${fmt(worth)} gp</h2>${capbar}`;
  if(pctc>=100)h+=`<div class="empty" style="color:var(--blood)">Every slot is taken. Gathering has stopped and new item types are being lost.</div>`;
  const geFull=(S.offers||[]).length>=GE_SLOTS;
  for(const k of keys){
    const it=item(k),n=S.bank[k],eq=EQ[k];
    const worn=eq&&S.equip[eq.slot]===k;
    const tags=[`market ${fmt(marketPrice(k))} gp &middot; vendor ${fmt(Math.floor(it.v*0.7))} gp`];
    if(it.heal)tags.push(`heals ${it.heal}`);
    if(it.ammo)tags.push(`${it.ammo} · +${it.str} power`);
    if(eq){if(eq.str)tags.push(`+${eq.str} str`);if(eq.def)tags.push(`+${eq.def} def`);tags.push(eq.slot);}
    h+=`<div class="row"><div class="grow"><b>${it.n}</b><span>${tags.join(' · ')}</span></div>
      <span class="qty num">${fmt(n)}</span>
      ${eq?`<button class="mini eq" data-equip="${k}">${worn?'Worn':'Equip'}</button>`:''}
      <button class="mini${pick&&pick.id===k&&pick.mode==='list'?' on':''}" data-pick="list:${k}" ${geFull?'disabled':''}>List</button>
      <button class="mini${pick&&pick.id===k&&pick.mode==='sell'?' on':''}" data-pick="sell:${k}">Vendor</button></div>`;
    // Quantity strip. No number inputs anywhere else in this app, so it stays
    // buttons: the round numbers you actually own, then All.
    h+=pickStrip(k,'sell',Math.floor(it.v*0.7),n,`${fmt(n)} held`);
    h+=pickStrip(k,'list',marketPrice(k),n,`${fmt(n)} held`);
  }
  return h;
}

  return h;

function bodyHtml(){
  return tab==='train'?viewTrain():tab==='fight'?viewFight():tab==='quests'?viewQuests()
    :tab==='bank'?viewBank():viewShop();
}
let stashedRestoreText='';
function repaint(){
  const v=$('view'),y=v.scrollTop;
  /* The view is rebuilt wholesale with innerHTML, which destroys and
     recreates every element inside it. Doing that while someone is typing
     rips the field out from under them: focus is lost, the soft keyboard
     closes, and any paste menu vanishes. So hold off entirely while a text
     field is in use, and carry its contents across rebuilds either way. */
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')){
    if(ae.id==='loadtext')stashedRestoreText=ae.value;
    return;
  }
  const before=document.getElementById('loadtext');
  if(before)stashedRestoreText=before.value;
  v.querySelectorAll('details.group').forEach(d=>{
    const k=d.querySelector('summary').textContent;
    if(d.open)openGroups.add(k);else openGroups.delete(k);
  });
  v.innerHTML=bodyHtml();
  v.querySelectorAll('details.group').forEach(d=>{
    if(openGroups.has(d.querySelector('summary').textContent))d.open=true;
  });
  v.scrollTop=y;
  const after=document.getElementById('loadtext');
  if(after&&stashedRestoreText)after.value=stashedRestoreText;
  $('purse').innerHTML=`${fmt(S.gp)} <span>gp</span>`;
  const qb=document.querySelector('nav button[data-tab="quests"]');
  qb.innerHTML='Quests'+(questsReady()?'<span class="pip"></span>':'');
}
function render(){
  renderDoing();repaint();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;pick=null;render();
});
$('view').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){
    const key=b.dataset.go;
    if(S.act===key){S.act=null;S.foe=null;}
    else{
      const bf=BOSSES.find(x=>'fight:'+x.id===key);
      if(bf){
        if(combatLvl()<bf.req){toast(`Needs combat ${bf.req}`);return;}
        if(have('boss_sigil')<1){toast('No boss sigil');return;}
        take('boss_sigil',1);S.foe=null;S.foeHp=0;
        pushLog(`Sigil spent — entering ${bf.n}`,'task');
      }
      if(key.startsWith('fight')&&S.act!==key)resetSess();
      S.act=key;S.prog=0;S.stun=0;if(!key.startsWith('fight'))S.foe=null;
    }
    render();save();return;
  }
  if(b.dataset.pick){
    const i=b.dataset.pick.indexOf(':');
    const mode=b.dataset.pick.slice(0,i),id=b.dataset.pick.slice(i+1);
    if(mode==='list'&&(S.offers||[]).length>=GE_SLOTS){toast('No free offer slots');return;}
    pick=(pick&&pick.id===id&&pick.mode===mode)?null:{id,mode};
    render();return;
  }
  if(b.dataset.pickcancel){pick=null;render();return;}
  if(b.dataset.pickqty){
    if(!pick)return;
    const q=parseInt(b.dataset.pickqty,10)||0;
    if(q>0){
      if(pick.mode==='sell')vendor(pick.id,q);
      else if(pick.mode==='list')listOffer(pick.id,q);
      else if(pick.mode==='order')buyOffer(pick.id,q);
      else if(pick.mode==='shop')shopBuy(pick.id,q);
    }
    pick=null;render();save();return;
  }
  if(b.dataset.equip){
    const k=b.dataset.equip,eq=EQ[k];
    S.equip[eq.slot]=S.equip[eq.slot]===k?null:k;render();save();return;
  }
  if(b.dataset.tool){
    const t=b.dataset.tool,next=TOOLS[t][S.tools[t]+1];
    if(!next||S.gp<next.cost)return;
    S.gp-=next.cost;S.tools[t]++;toast(`Bought ${next.n}`);render();save();return;
  }
  if(b.dataset.quest){
    const q=QUESTS.find(x=>x.id===b.dataset.quest);if(q)claimQuest(q);
    render();save();return;
  }
  if(b.dataset.skiptask){rollTask();render();save();return;}
  if(b.dataset.checkupdate){Updater.check();return;}
  if(b.dataset.doupdate){Updater.apply();return;}
  if(b.dataset.slot){
    const i=+b.dataset.slot;
    loadSlot(i).then(()=>{lastFrame=Date.now();render();toast(`Slot ${i} active`);});
    return;
  }
  if(b.dataset.slotdel){
    const i=+b.dataset.slotdel;
    if(!confirm(`Erase slot ${i}? This cannot be undone.`))return;
    Store.del(slotKey(i)).then(refreshSlots).then(()=>{render();toast(`Slot ${i} erased`);});
    return;
  }
  if(b.dataset.copy){
    const t=JSON.stringify(S);
    const ta=document.getElementById('savetext');
    if(ta){ta.select();}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>toast('Save copied'),()=>toast('Copy blocked — select the text manually'));
    }else{
      try{document.execCommand('copy');toast('Save copied');}
      catch(e){toast('Copy blocked — select the text manually');}
    }
    return;
  }
  if(b.dataset.download){
    try{
      const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const d=new Date();
      a.href=url;
      a.download=`hollowmere-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast('Save downloaded');
    }catch(e){toast('Download blocked — use Copy instead');}
    return;
  }
  if(b.dataset.restore){
    const ta=document.getElementById('loadtext');
    const raw=((ta&&ta.value)||stashedRestoreText||'').trim();
    if(!raw){toast('Paste a save first');return;}
    let p;
    try{p=JSON.parse(raw);}catch(e){toast('That is not valid save data');return;}
    if(!p||typeof p!=='object'||!p.xp||typeof p.xp!=='object'){toast('That save is missing its skills');return;}
    if(!confirm('Replace your current save? This cannot be undone.'))return;
    const f=fresh();
    S=Object.assign(f,p);
    S.xp=Object.assign(fresh().xp,p.xp||{});
    S.equip=Object.assign(fresh().equip,p.equip||{});
    S.house=Object.assign(fresh().house,p.house||{});
    S.farm=Array.isArray(p.farm)?p.farm:f.farm;
    S.offers=Array.isArray(p.offers)?p.offers:[];
    S.market=p.market||{};S.pets=p.pets||{};
    while(S.farm.length<totalPatches())S.farm.push({crop:null,ms:0});
    S.last=Date.now();
    stashedRestoreText='';
    render();save();toast('Save restored');
    return;
  }
  if(b.dataset.nudge){
    const o=S.offers[+b.dataset.nudge];if(!o)return;
    if(o.kind==='sell')o.price=Math.max(1,Math.round(o.price*0.92));
    else{
      const extra=Math.round(o.price*0.08)*(o.qty-o.filled);
      if(S.gp<extra){toast('Not enough gold to raise the bid');return;}
      S.gp-=extra;o.price=Math.round(o.price*1.08);
    }
    render();save();return;
  }
  if(b.dataset.cancel){
    const i=+b.dataset.cancel,o=S.offers[i];if(!o)return;
    const left=o.qty-o.filled;
    if(o.kind==='sell')add(o.id,left);else S.gp+=left*o.price;
    S.offers.splice(i,1);
    toast('Offer cancelled');render();save();return;
  }
  if(b.dataset.delve){
    const d=DUNGEONS.find(x=>x.id===b.dataset.delve);if(!d)return;
    if(combatLvl()<d.req){toast(`Needs combat ${d.req}`);return;}
    if(S.delve&&S.delve.id===d.id){S.delve=null;S.act=null;S.foe=null;toast('Left the dungeon');}
    else{S.delve={id:d.id,floor:0};S.act='delve:'+d.id;S.foe=null;S.foeHp=0;S.prog=0;
      resetSess();pushLog(`Entered ${d.n}`,'task');}
    render();save();return;
  }
  if(b.dataset.room){
    const r=ROOMS.find(x=>x.id===b.dataset.room);if(!r)return;
    const nt=room(r.id)+1;if(nt>3)return;
    const c=r.cost(nt);
    if(S.gp<(c.gp||0))return;
    for(const k in c)if(k!=='gp'&&have(k)<c[k])return;
    S.gp-=(c.gp||0);
    for(const k in c)if(k!=='gp')take(k,c[k]);
    S.house[r.id]=nt;
    if(r.id==='garden')while(S.farm.length<totalPatches())S.farm.push({crop:null,ms:0});
    toast(`${r.n} ${'I'.repeat(nt)} built`);render();save();return;
  }
  if(b.dataset.sow){
    const i=+b.dataset.sow,fl=lvl('farming');
    const sown=CROPS.filter(c=>fl>=c.lvl&&have(c.seed)>0);
    if(!sown.length)return;
    const c=sown[sown.length-1];
    take(c.seed,1);S.farm[i]={crop:c.id,ms:c.ms};grantXp('farming',c.plant);
    toast(`Sowed ${c.n}`);render();save();return;
  }
  if(b.dataset.harvest){
    const i=+b.dataset.harvest,pt=S.farm[i];
    if(!pt.crop||pt.ms>0)return;
    const c=CROPS.find(x=>x.id===pt.crop);
    const n=c.yield[0]+Math.floor(Math.random()*(c.yield[1]-c.yield[0]+1));
    const got=add(c.out,n);grantXp('farming',c.harv);
    rollPet('farming',c.ms/4);   // scaled to grow time so slow crops aren't punished
    S.farm[i]={crop:null,ms:0};
    toast(got?`Harvested ${got}× ${item(c.out).n}`:'Bank full — harvest lost');
    render();save();return;
  }
  if(b.dataset.bank){
    const t=(S.bankTier||0)+1;if(!BANK_TIERS[t]||S.gp<BANK_COST[t])return;
    S.gp-=BANK_COST[t];S.bankTier=t;toast(`Bank expanded to ${BANK_TIERS[t]} slots`);render();save();return;
  }
  if(b.dataset.patch){
    const cost=[0,0,0,8000,40000,180000][S.patches];
    if(S.patches>=6||S.gp<cost)return;
    S.gp-=cost;S.patches++;S.farm.push({crop:null,ms:0});
    toast(`${S.patches} patches`);render();save();return;
  }
  if(b.dataset.clearlog){S.log=[];resetSess();render();save();return;}
  if(b.dataset.wipe){if(confirm('Wipe your save? This cannot be undone.'))wipe();}
});

/* ============================================================
   LOOP
   ============================================================ */
let lastFrame=Date.now(),sinceSave=0,sinceFull=0;
function loop(){
  const now=Date.now(),dt=Math.min(now-lastFrame,2000);lastFrame=now;
  const before=S.act;
  tick(dt);
  renderDoing();
  sinceFull+=dt;
  if(sinceFull>800||before!==S.act){sinceFull=0;repaint();}
  sinceSave+=dt;if(sinceSave>10000){sinceSave=0;save();}
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)save();
  else{const r=catchUp();lastFrame=Date.now();render();showCatchUp(r);}
});
(async function(){
  await Updater.register();
  await load();
  if(!S.task)rollTask();
  const r=catchUp();
  render();showCatchUp(r);
  lastFrame=Date.now();
  requestAnimationFrame(loop);
  // quiet check a few seconds in; only speaks up if there is something new
  if(Updater.supported)setTimeout(async()=>{
    await Updater.check();
    if(Updater.state==='ready')toast(`Version ${Updater.latest} available — Town tab`);
  },4000);
})();
</script>
</body>
</html>
