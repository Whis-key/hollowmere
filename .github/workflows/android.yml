name: Build Android APK

# Runs on demand, and whenever the Android shell itself changes.
# It does NOT run when index.html changes — the app loads the game over the
# network, so game edits need no rebuild.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secret exists
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # First run creates the key and commits it back, encrypted. Every run
      # after that decrypts the same one, so all builds share a signature and
      # install over each other without wiping app data.
      - name: Restore or create the signing keystore
        run: |
          set -euo pipefail
          if [ -f android/keystore.jks.enc ]; then
            echo "Decrypting the existing keystore."
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -d \
              -in android/keystore.jks.enc \
              -out android/keystore.jks \
              -pass env:KEYSTORE_PASSWORD
          else
            echo "No keystore yet — generating one."
            keytool -genkeypair -noprompt \
              -keystore android/keystore.jks \
              -alias hollowmere \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Hollowmere, O=Hollowmere, C=US"
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
              -in android/keystore.jks \
              -out android/keystore.jks.enc \
              -pass env:KEYSTORE_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks.enc
            # [skip ci] stops this commit from triggering another build
            git commit -m "Add encrypted signing keystore [skip ci]"
            git push
            echo "Keystore created and committed. Guard it — losing it means no"
            echo "future build can update an installed app without an uninstall."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Confirm the APK is signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Publish APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" hollowmere.apk
          # Quoted heredoc: the shell leaves the backticks alone, and Actions
          # has already substituted its expressions by the time this runs.
          cat > notes.md <<'EOF'
          Signed release build of the Android shell.

          **Installing.** Install it straight over the app already on the phone.
          The signature matches, so it updates in place and your saves are kept.

          **This is not how you update the game.** The APK is only a shell; the
          game itself is loaded from GitHub Pages at runtime. To pick up game
          changes, open the app and use **Town -> App version -> Check ->
          Update**. A new APK is only needed when something under `android/`
          changes -- the WebView config, the manifest, the icon.

          ---

          versionCode `${{ github.run_number }}`, built from commit
          `${{ github.sha }}`.
          EOF
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest hollowmere.apk \
            --title "Hollowmere APK" \
            --notes-file notes.md
