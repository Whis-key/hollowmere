name: Build Android APK

# Runs on demand, and whenever the Android shell itself changes.
# It does NOT run when index.html changes — the app loads the game over the
# network, so game edits need no rebuild.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "Publishing $APK"
          cp "$APK" hollowmere.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest hollowmere.apk \
            --title "Hollowmere APK (debug)" \
            --notes "Debug build from ${{ github.sha }}.

          Download hollowmere.apk below and open it on your phone to install.
          The game itself is loaded from GitHub Pages at runtime, so this APK
          only needs rebuilding when the Android shell changes — not when the
          game changes."
